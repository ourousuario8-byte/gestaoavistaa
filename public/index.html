<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão a vista - Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/tema.css" rel="stylesheet">
    <style>

        body { display: flex; align-items: center; justify-content: center; }

        .login-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: clamp(28px, 6vw, 44px);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: var(--primary-soft);
            color: var(--primary-text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
        }

        h1 { font-size: 24px; font-weight: 700; margin-bottom: 28px; letter-spacing: -.01em; }

        .form-group { margin-bottom: 18px; text-align: left; }
        label i { color: var(--muted); margin-right: 4px; }

        .btn { width: 100%; padding: 13px; font-size: 15px; background: var(--primary); color: #fff; margin-top: 6px; }
        .btn:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-forte); }

        .status { display: block; margin-top: 18px; text-align: left; }
        .status:empty { display: none; }

        .test-section { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
        .test-section h3 { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
        .credentials { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; font-size: 13px; text-align: left; }
        .credentials strong { color: var(--primary-text); }

        .loading { display: inline-block; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-users"></i>
        </div>
        <h1>Gestão perlog</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="usuario">
                    <i class="fas fa-user"></i> Usuário
                </label>
                <input type="text" id="usuario" name="usuario" required>
            </div>
            
            <div class="form-group">
                <label for="senha">
                    <i class="fas fa-lock"></i> Senha
                </label>
                <input type="password" id="senha" name="senha" required>
            </div>
            
            <button type="submit" class="btn" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
        </form>
        
        <div id="loginStatus"></div>
        

    <script>
        const API_BASE = window.location.origin;

        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('loginStatus');
            statusEl.innerHTML = message;
            statusEl.className = `status ${type}`;
        }

        // Função de login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            
            if (!usuario || !senha) {
                showStatus('<i class="fas fa-exclamation-triangle"></i> Preencha usuário e senha', 'error');
                return;
            }
            
            // Desabilita botão e mostra loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner loading"></i> Entrando...';
            showStatus('<i class="fas fa-cog loading"></i> Validando credenciais...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/api/auth`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'login',
                        usuario,
                        senha
                    })
                });
                
                const result = await response.json();
                
                console.log('Resposta do login:', result);
                
                if (result.ok) {
                    showStatus('<i class="fas fa-check-circle"></i> Login realizado com sucesso!', 'success');
                    
                    // CORREÇÃO: Salva dados corretamente no sessionStorage
                    sessionStorage.setItem('usuario', result.usuario);
                    sessionStorage.setItem('abas', JSON.stringify(result.abas));
                    sessionStorage.setItem('token', result.token || '');
                    
                    console.log('Dados salvos no sessionStorage:', {
                        usuario: result.usuario,
                        abas: result.abas
                    });
                    
                    // Redireciona para o menu após um breve delay
                    setTimeout(() => {
                        console.log('Redirecionando para menu...');
                        window.location.href = '/menu';
                    }, 1000);
                    
                } else {
                    showStatus(`<i class="fas fa-times-circle"></i> ${result.msg || 'Credenciais inválidas'}`, 'error');
                }
                
            } catch (error) {
                console.error('Erro no login:', error);
                showStatus('<i class="fas fa-exclamation-triangle"></i> Erro de conexão. Verifique sua internet.', 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar';
            }
        });

     
        // Limpa sessionStorage ao carregar a página de login
        window.onload = function() {
            console.log('Página de login carregada');
            sessionStorage.clear();
            
            // Auto-preenche credenciais para desenvolvimento local
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                document.getElementById('usuario').value = 'admin';
                document.getElementById('senha').value = '123';
            }
        };

        // Permite login com Enter
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('loginBtn').disabled) {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        // Debug
        console.log('Login page loaded');
    </script>
</body>
</html>
