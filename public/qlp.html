<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard QLP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/tema.css" rel="stylesheet">
    <style>

        .container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: clamp(16px, 3vw, 28px);
        }
        .container > .header { border: none; box-shadow: none; padding: 0 0 18px; border-bottom: 1px solid var(--border); border-radius: 0; }
        .stats-grid { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
        .stat-card { position: relative; }
        .stat-card h3 { font-size: 12px; }
        .stat-card .stat-value { font-size: clamp(24px, 3vw, 30px); font-weight: 700; color: var(--primary-text); }
        .stat-card > i { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); margin: 0; }
        .stat-card.ok .stat-value { color: var(--green); }
        .stat-card.ok > i { background: var(--green-soft); color: var(--green); }
        .stat-card.nok .stat-value { color: var(--red); }
        .stat-card.nok > i { background: var(--red-soft); color: var(--red); }
        .stat-card.info .stat-value { color: var(--blue); }
        .stat-card.info > i { background: var(--blue-soft); color: var(--blue); }

        .filters {
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: var(--radius);
            margin-bottom: 20px;
        }
        .filter-group label i { color: var(--muted); margin-right: 4px; }

        .table-wrapper { border: 1px solid var(--border); border-radius: var(--radius-sm); }
        td { white-space: nowrap; font-size: 13px; }
        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { color: var(--text); }
        th.sortable::after { content: " ⇅"; opacity: .5; }
        th.sort-asc::after { content: " ↑"; opacity: 1; }
        th.sort-desc::after { content: " ↓"; opacity: 1; }

        .badge-ativo { background: var(--green-soft); color: var(--green); }
        .badge-inativo { background: var(--red-soft); color: var(--red); }

        .loading { text-align: center; padding: 60px 20px; color: var(--muted); }
        .loading i { font-size: 40px; color: var(--primary); animation: tema-spin 1s linear infinite; }

        .status { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
        .status:empty { display: none; }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 16px; padding: 10px; flex-wrap: wrap; }
        .pagination button {
            padding: 8px 14px;
            border: 1px solid var(--border-forte);
            background: var(--surface);
            color: var(--text);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font: inherit;
            font-weight: 600;
        }
        .pagination button:hover:not(:disabled) { background: var(--primary-soft); color: var(--primary-text); border-color: transparent; }
        .pagination button:disabled { opacity: .5; cursor: not-allowed; }

        .analise-section { background: var(--surface-2); border: 1px solid var(--border); padding: 18px; border-radius: var(--radius); margin-bottom: 20px; }
        .analise-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 14px; }
        .analise-card { background: var(--surface); border: 1px solid var(--border); padding: 16px; border-radius: var(--radius-sm); }
        .analise-card h4 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
        .analise-bar { display: flex; height: 26px; border-radius: 999px; overflow: hidden; margin: 10px 0; background: var(--surface-2); }
        .analise-bar-item { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
        .analise-bar-ativos { background: #cfe8d7; color: var(--green); }
        .analise-bar-inativos { background: #f3d0ce; color: var(--red); }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media print {
            body { background: #fff; padding: 0; }
            .filters, .container > .header > div { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-chart-bar"></i> Dashboard QLP</h1>
            <div class="header-actions">
                <button class="btn btn-success" onclick="exportarCSV()">
                    <i class="fas fa-file-csv"></i> CSV
                </button>
                <button class="btn btn-info" onclick="window.print()">
                    <i class="fas fa-print"></i> Imprimir
                </button>
                <button class="btn btn-warning" onclick="location.reload()">
                    <i class="fas fa-sync-alt"></i> Atualizar
                </button>
                <button class="btn btn-secondary" onclick="window.location.href='/menu'">
                    <i class="fas fa-arrow-left"></i> Voltar
                </button>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="filters">
            <div class="filters-row">
                <div class="filter-group">
                    <label><i class="fas fa-search"></i> Buscar</label>
                    <input type="text" id="searchInput" placeholder="Nome ou chapa...">
                </div>
                <div class="filter-group">
                    <label><i class="fas fa-layer-group"></i> Seção</label>
                    <select id="filtroSecao" data-busca><option value="">Todas</option></select>
                </div>
                <div class="filter-group">
                    <label><i class="fas fa-clock"></i> Turno</label>
                    <select id="filtroTurno" data-busca><option value="">Todos</option></select>
                </div>
                <div class="filter-group">
                    <label><i class="fas fa-user-tie"></i> Supervisor</label>
                    <select id="filtroSupervisor" data-busca><option value="">Todos</option></select>
                </div>
                <div class="filter-group">
                    <label><i class="fas fa-briefcase"></i> Função</label>
                    <select id="filtroFuncao" data-busca><option value="">Todas</option></select>
                </div>
                <div class="filter-group">
                    <label><i class="fas fa-toggle-on"></i> Situação</label>
                    <select id="filtroSituacao">
                        <option value="">Todas</option>
                        <option value="ativo">Ativos</option>
                        <option value="inativo">Inativos</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label><i class="fas fa-list-ol"></i> Por página</label>
                    <select id="pageSize">
                        <option value="50" selected>50</option>
                        <option value="100">100</option>
                        <option value="999999">Todos</option>
                    </select>
                </div>
            </div>
            <div class="filter-actions">
                <button class="btn btn-primary" onclick="aplicarFiltros()">
                    <i class="fas fa-filter"></i> Filtrar
                </button>
                <button class="btn btn-secondary" onclick="limparFiltros()">
                    <i class="fas fa-eraser"></i> Limpar
                </button>
                <button class="btn btn-info" onclick="toggleAnalise()">
                    <i class="fas fa-chart-pie"></i> <span id="btnAnaliseText">Mostrar Análises</span>
                </button>
            </div>
        </div>

        <div id="analiseSection" class="analise-section" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h3 style="color: var(--primary); margin: 0;">
                    <i class="fas fa-chart-pie"></i> <span id="tituloAnalise">Análise por Seção</span>
                </h3>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-primary" id="btnSecao" onclick="mudarAnalise('secao')" style="opacity: 1;">
                        <i class="fas fa-layer-group"></i> Por Seção
                    </button>
                    <button class="btn btn-secondary" id="btnFuncao" onclick="mudarAnalise('funcao')" style="opacity: 0.6;">
                        <i class="fas fa-briefcase"></i> Por Função
                    </button>
                </div>
            </div>
            <div id="analiseContent"></div>
        </div>

        <div id="loadingDiv" class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Carregando dados da aba QLP...</p>
        </div>

        <div id="contentDiv" style="display: none;">
            <div class="table-wrapper">
                <table id="quadroTable">
                    <thead>
                        <tr>
                            <th class="sortable" data-col="chapa">Chapa</th>
                            <th class="sortable" data-col="nome">Nome</th>
                            <th class="sortable" data-col="funcao">Função</th>
                            <th class="sortable" data-col="secao">Seção</th>
                            <th class="sortable" data-col="turno">Turno</th>
                            <th class="sortable" data-col="supervisor">Supervisor</th>
                            <th class="sortable" data-col="dtAdmissao">Admissão</th>
                            <th class="sortable" data-col="situacao">Situação</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="pagination">
                <button onclick="mudarPagina(-1)" id="btnPrev">
                    <i class="fas fa-chevron-left"></i> Anterior
                </button>
                <span id="pageInfo">Página 1 de 1</span>
                <button onclick="mudarPagina(1)" id="btnNext">
                    Próxima <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <div id="statusDiv"></div>
    </div>

    <script>
        let dados = [];
        let filtrados = [];
        let pagina = 1;
        let porPagina = 50;
        let sortCol = '';
        let sortDir = 'asc';
        let stats = null;
        let tipoAnalise = 'secao';

        function showStatus(msg, type = 'info') {
            const el = document.getElementById('statusDiv');
            const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-triangle' : 'info-circle';
            el.innerHTML = `<i class="fas fa-${icon}"></i> ${msg}`;
            el.className = `status ${type}`;
            setTimeout(() => el.innerHTML = '', 5000);
        }

        async function carregarDados() {
            try {
                console.log('Buscando /api/qlp/quadro');
                const res = await fetch('/api/qlp/quadro');
                console.log('Status:', res.status);
                
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                const result = await res.json();
                console.log('Dados:', result);
                
                if (result.ok) {
                    dados = result.colaboradores || [];
                    filtrados = [...dados];
                    stats = result.estatisticas;
                    
                    atualizarStats(stats);
                    preencherFiltros();
                    renderTabela();
                    
                    document.getElementById('loadingDiv').style.display = 'none';
                    document.getElementById('contentDiv').style.display = 'block';
                    showStatus(`${dados.length} colaboradores carregados`, 'success');
                } else {
                    throw new Error(result.msg || 'Erro desconhecido');
                }
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('loadingDiv').innerHTML = `
                    <i class="fas fa-exclamation-triangle" style="color: var(--red); font-size: 64px;"></i>
                    <p style="color: var(--red); margin-top: 20px;">Erro ao carregar dados</p>
                    <p style="font-size: 14px; color: var(--muted);">${error.message}</p>
                    <button class="btn btn-warning" onclick="location.reload()" style="margin-top: 20px;">
                        <i class="fas fa-sync-alt"></i> Tentar Novamente
                    </button>
                    <button class="btn btn-secondary" onclick="window.location.href='/menu'" style="margin-top: 20px;">
                        <i class="fas fa-arrow-left"></i> Voltar
                    </button>
                `;
                showStatus(error.message, 'error');
            }
        }

        function atualizarStats(s) {
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card">
                    <h3>Total</h3>
                    <div class="stat-value">${s.total}</div>
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-card ok">
                    <h3>Ativos</h3>
                    <div class="stat-value">${s.ativos}</div>
                    <i class="fas fa-user-check"></i>
                </div>
                <div class="stat-card nok">
                    <h3>Inativos</h3>
                    <div class="stat-value">${s.inativos}</div>
                    <i class="fas fa-user-times"></i>
                </div>
                <div class="stat-card info">
                    <h3>Seções</h3>
                    <div class="stat-value">${s.totalSecoes}</div>
                    <i class="fas fa-layer-group"></i>
                </div>
            `;
        }

        function preencherFiltros() {
            const secoes = [...new Set(dados.map(d => d.secao).filter(Boolean))].sort();
            const turnos = [...new Set(dados.map(d => d.turno).filter(Boolean))].sort();
            const sups = [...new Set(dados.map(d => d.supervisor).filter(Boolean))].sort();
            const funcoes = [...new Set(dados.map(d => d.funcao).filter(Boolean))].sort();
            
            document.getElementById('filtroSecao').innerHTML = '<option value="">Todas</option>' + 
                secoes.map(s => `<option value="${s}">${s}</option>`).join('');
            document.getElementById('filtroTurno').innerHTML = '<option value="">Todos</option>' + 
                turnos.map(t => `<option value="${t}">${t}</option>`).join('');
            document.getElementById('filtroSupervisor').innerHTML = '<option value="">Todos</option>' + 
                sups.map(s => `<option value="${s}">${s}</option>`).join('');
            document.getElementById('filtroFuncao').innerHTML = '<option value="">Todas</option>' + 
                funcoes.map(f => `<option value="${f}">${f}</option>`).join('');
        }

        function aplicarFiltros() {
            const busca = document.getElementById('searchInput').value.toLowerCase();
            const secao = document.getElementById('filtroSecao').value;
            const turno = document.getElementById('filtroTurno').value;
            const supervisor = document.getElementById('filtroSupervisor').value;
            const funcao = document.getElementById('filtroFuncao').value;
            const situacao = document.getElementById('filtroSituacao').value;
            
            filtrados = dados.filter(d => {
                const b = !busca || d.nome.toLowerCase().includes(busca) || d.chapa.includes(busca);
                const sec = !secao || d.secao === secao;
                const tur = !turno || d.turno === turno;
                const sup = !supervisor || d.supervisor === supervisor;
                const func = !funcao || d.funcao === funcao;
                const sit = !situacao || (situacao === 'ativo' ? d.isAtivo : !d.isAtivo);
                return b && sec && tur && sup && func && sit;
            });
            
            pagina = 1;
            renderTabela();
            showStatus(`${filtrados.length} registros encontrados`, 'info');
        }

        function limparFiltros() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filtroSecao').value = '';
            document.getElementById('filtroTurno').value = '';
            document.getElementById('filtroSupervisor').value = '';
            document.getElementById('filtroFuncao').value = '';
            document.getElementById('filtroSituacao').value = '';
            filtrados = [...dados];
            pagina = 1;
            renderTabela();
        }

        function renderTabela() {
            const tbody = document.querySelector('#quadroTable tbody');
            porPagina = parseInt(document.getElementById('pageSize').value);
            
            if (sortCol) {
                filtrados.sort((a, b) => {
                    let vA = (a[sortCol] || '').toString().toLowerCase();
                    let vB = (b[sortCol] || '').toString().toLowerCase();
                    return (vA < vB ? -1 : vA > vB ? 1 : 0) * (sortDir === 'asc' ? 1 : -1);
                });
            }
            
            const totalPag = Math.ceil(filtrados.length / porPagina);
            const inicio = (pagina - 1) * porPagina;
            const fim = inicio + porPagina;
            const dadosPag = filtrados.slice(inicio, fim);
            
            if (dadosPag.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><i class="fas fa-inbox"></i><p>Nenhum registro</p></td></tr>';
            } else {
                tbody.innerHTML = dadosPag.map(d => `
                    <tr>
                        <td><strong>${d.chapa}</strong></td>
                        <td>${d.nome}</td>
                        <td>${d.funcao}</td>
                        <td>${d.secao}</td>
                        <td>${d.turno}</td>
                        <td>${d.supervisor}</td>
                        <td>${d.dtAdmissao}</td>
                        <td><span class="badge ${d.isAtivo ? 'badge-ativo' : 'badge-inativo'}">${d.situacao}</span></td>
                    </tr>
                `).join('');
            }
            
            document.getElementById('pageInfo').textContent = `Página ${pagina} de ${totalPag || 1} (${filtrados.length} registros)`;
            document.getElementById('btnPrev').disabled = pagina === 1;
            document.getElementById('btnNext').disabled = pagina >= totalPag;
        }

        function mudarPagina(dir) {
            pagina += dir;
            renderTabela();
        }

        function ordenarTabela(col) {
            if (sortCol === col) {
                sortDir = sortDir === 'asc' ? 'desc' : 'asc';
            } else {
                sortCol = col;
                sortDir = 'asc';
            }
            
            document.querySelectorAll('th.sortable').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.dataset.col === col) th.classList.add(`sort-${sortDir}`);
            });
            
            renderTabela();
        }

        function toggleAnalise() {
            const sec = document.getElementById('analiseSection');
            const txt = document.getElementById('btnAnaliseText');
            
            if (sec.style.display === 'none') {
                gerarAnalise();
                sec.style.display = 'block';
                txt.textContent = 'Ocultar Análises';
            } else {
                sec.style.display = 'none';
                txt.textContent = 'Mostrar Análises';
            }
        }

        function mudarAnalise(tipo) {
            tipoAnalise = tipo;
            
            // Atualiza botões
            document.getElementById('btnSecao').style.opacity = tipo === 'secao' ? '1' : '0.6';
            document.getElementById('btnFuncao').style.opacity = tipo === 'funcao' ? '1' : '0.6';
            
            document.getElementById('btnSecao').className = tipo === 'secao' ? 'btn btn-primary' : 'btn btn-secondary';
            document.getElementById('btnFuncao').className = tipo === 'funcao' ? 'btn btn-primary' : 'btn btn-secondary';
            
            // Atualiza título
            document.getElementById('tituloAnalise').textContent = tipo === 'secao' ? 'Análise por Seção' : 'Análise por Função';
            
            // Regera análise
            gerarAnalise();
        }

        function gerarAnalise() {
            if (!stats) return;
            
            let dados, icone;
            
            if (tipoAnalise === 'secao') {
                if (!stats.porSecao) return;
                dados = Object.entries(stats.porSecao).sort((a, b) => b[1].total - a[1].total);
                icone = 'layer-group';
            } else {
                if (!stats.porFuncao) return;
                dados = Object.entries(stats.porFuncao).sort((a, b) => b[1].total - a[1].total);
                icone = 'briefcase';
            }
            
            document.getElementById('analiseContent').innerHTML = `
                <div class="analise-grid">
                    ${dados.map(([nome, d]) => {
                        // Garante que temos valores numéricos válidos
                        const total = d.total || 0;
                        const ativos = d.ativos || 0;
                        const inativos = total - ativos; // Calcula inativos corretamente
                        
                        const pA = total > 0 ? ((ativos / total) * 100).toFixed(1) : '0.0';
                        const pI = total > 0 ? ((inativos / total) * 100).toFixed(1) : '0.0';
                        
                        return `
                            <div class="analise-card">
                                <h4><i class="fas fa-${icone}" style="color: var(--primary); margin-right: 8px;"></i>${nome}</h4>
                                <p style="color: var(--muted); margin-bottom: 10px; font-weight: 600;">Total: ${total} colaboradores</p>
                                <div class="analise-bar">
                                    <div class="analise-bar-item analise-bar-ativos" style="width: ${pA}%">
                                        ${ativos > 0 ? ativos : ''}
                                    </div>
                                    <div class="analise-bar-item analise-bar-inativos" style="width: ${pI}%">
                                        ${inativos > 0 ? inativos : ''}
                                    </div>
                                </div>
                                <p style="font-size: 12px; color: var(--muted); margin-top: 10px;">
                                    <span style="color: var(--green); font-weight: bold;">●</span> Ativos: ${ativos} (${pA}%) | 
                                    <span style="color: var(--red); font-weight: bold;">●</span> Inativos: ${inativos} (${pI}%)
                                </p>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function exportarCSV() {
            const headers = ['Chapa', 'Nome', 'Função', 'Seção', 'Turno', 'Supervisor', 'Admissão', 'Situação'];
            let csv = headers.join(',') + '\n';
            
            filtrados.forEach(d => {
                csv += [d.chapa, `"${d.nome}"`, `"${d.funcao}"`, `"${d.secao}"`, d.turno, `"${d.supervisor}"`, d.dtAdmissao, d.situacao].join(',') + '\n';
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `QLP_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            showStatus('CSV exportado!', 'success');
        }

        document.getElementById('searchInput').addEventListener('keyup', e => {
            if (e.key === 'Enter') aplicarFiltros();
        });

        document.getElementById('pageSize').addEventListener('change', () => {
            pagina = 1;
            renderTabela();
        });

        document.querySelectorAll('th.sortable').forEach(th => {
            th.addEventListener('click', () => ordenarTabela(th.dataset.col));
        });

        window.onload = function() {
            const usuario = sessionStorage.getItem('usuario');
            if (!usuario) {
                showStatus('Sessão expirada', 'error');
                setTimeout(() => window.location.href = '/', 2000);
                return;
            }
            carregarDados();
        };
    </script>
    <script src="/js/ui.js"></script>
</body>
</html>
