<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="/js/fuso.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoria de Avaria</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="/css/tema.css" rel="stylesheet">
  <style>

    .container { max-width: 900px; }
    .container > .header { margin-bottom: 20px; }
    .user-info { font-size: 14px; color: var(--muted); margin-top: 4px; }
    .content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(16px, 3vw, 28px);
    }
    .form-group { margin-bottom: 18px; }
    textarea { min-height: 80px; resize: vertical; }
    .error-message, .success-message { padding: 11px 14px; border-radius: var(--radius-sm); margin-top: 10px; display: none; font-size: 14px; }
    .error-message { background: var(--red-soft); color: var(--red); }
    .success-message { background: var(--green-soft); color: var(--green); }
    .error-message.show, .success-message.show { display: block; }
    .debug-section { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--border); }
    .debug-log {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px;
      border-radius: var(--radius-sm);
      max-height: 300px;
      overflow-y: auto;
      font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
    }
    .debug-log .time { color: var(--muted); }
    .debug-log .error { color: var(--red); }
    .debug-log .success { color: var(--green); }
    .debug-log .info { color: var(--blue); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fas fa-box-open"></i> Auditoria de Avaria</h1>
      <div class="user-info">Usuário: <span id="usuarioAvaria">-</span></div>
    </div>

    <div class="content">
      <div class="form-group">
        <label for="productCode">Código do Produto (EAN/DUN/COD):</label>
        <input 
          type="text" 
          id="productCode" 
          placeholder="Escaneie ou digite o código..."
          autofocus
        />
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
      </div>

      <div class="form-group">
        <label for="description">Descrição:</label>
        <textarea id="description" readonly></textarea>
      </div>

      <div class="form-group">
        <label for="packaging">Embalagem:</label>
        <input type="text" id="packaging" readonly />
      </div>

      <div class="debug-section">
        <label>Console de Debug:</label>
        <div class="debug-log" id="debugLog"></div>
      </div>
    </div>
  </div>

  <script>
  // ===== CÓDIGO JAVASCRIPT CORRIGIDO PARA avaria.html =====
// Substitua o <script> atual por este código

const API_URL = '/api/avaria';
let mapaBuscaLocal = {}; // ← SEMPRE objeto simples
let produtosCarregados = false;

function log(message, type = 'info') {
  const logDiv = document.getElementById('debugLog');
  const time = new Date().toLocaleTimeString('pt-BR');
  const entry = document.createElement('div');
  entry.innerHTML = `<span class="time">${time}</span> <span class="${type}">[AVARIA]</span> ${message}`;
  logDiv.appendChild(entry);
  logDiv.scrollTop = logDiv.scrollHeight;
  console.log(`[AVARIA] ${message}`);
}

// Gera variações do código para busca
function gerarVariacoes(codigo) {
  if (!codigo) return [];
  
  const codigoStr = String(codigo).trim();
  const variacoes = new Set();
  
  // Original
  variacoes.add(codigoStr);
  
  // Sem zeros à esquerda
  const semZeros = codigoStr.replace(/^0+/, '') || '0';
  variacoes.add(semZeros);
  
  // Com zeros à esquerda (padrões comuns)
  if (!isNaN(codigoStr)) {
    variacoes.add(codigoStr.padStart(8, '0'));
    variacoes.add(codigoStr.padStart(12, '0'));
    variacoes.add(codigoStr.padStart(13, '0'));
    variacoes.add(codigoStr.padStart(14, '0'));
  }
  
  return Array.from(variacoes);
}

// Carregar dados da API ao iniciar
async function carregarDados() {
  try {
    log('Carregando dados da API...', 'info');

    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ action: 'obterDadosProdutos' })
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }

    const resultado = await response.json();
    
    console.log('[AVARIA] Resposta da API:', resultado);

    if (resultado.ok) {
      log(`Total de produtos: ${resultado.total}`, 'info');
      
      // ===== VALIDAÇÃO CRÍTICA =====
      if (!resultado.mapaBusca) {
        log('⚠ API não retornou mapaBusca', 'error');
        mapaBuscaLocal = {};
      } else if (typeof resultado.mapaBusca !== 'object') {
        log(`⚠ mapaBusca tem tipo inválido: ${typeof resultado.mapaBusca}`, 'error');
        mapaBuscaLocal = {};
      } else {
        // ✓ Recebe como objeto simples
        mapaBuscaLocal = resultado.mapaBusca;
        log(`Total de códigos indexados: ${Object.keys(mapaBuscaLocal).length}`, 'info');
      }

      produtosCarregados = true;
      log('✓ Dados carregados com sucesso', 'success');

      // Mostra alguns códigos indexados
      const exemplos = Object.keys(mapaBuscaLocal).slice(0, 10);
      log(`Primeiros códigos: ${exemplos.join(', ')}`, 'info');

    } else {
      log(`Erro: ${resultado.msg}`, 'error');
    }
  } catch (error) {
    log(`Erro ao carregar dados: ${error.message}`, 'error');
    console.error('[AVARIA] Erro completo:', error);
  }
}

// Buscar produto quando o usuário digita
document.getElementById('productCode').addEventListener('input', (e) => {
  const codigo = e.target.value.trim();

  if (!codigo) {
    clearProduct();
    return;
  }

  if (!produtosCarregados) {
    showError('Aguarde o carregamento dos dados...');
    return;
  }

  buscarProduto(codigo);
});

// Limpa ao pressionar Enter (simula scanner)
document.getElementById('productCode').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    const codigo = e.target.value.trim();
    if (codigo) {
      buscarProduto(codigo);
      // Opcional: limpar campo após busca
      // setTimeout(() => e.target.value = '', 1000);
    }
  }
});

function buscarProduto(codigoOriginal) {
  log(`🔍 Buscando: "${codigoOriginal}"`, 'info');
  log(`Total de produtos na base: ${Object.keys(mapaBuscaLocal).length}`, 'info');

  // ===== VALIDAÇÃO CRÍTICA =====
  if (!mapaBuscaLocal || typeof mapaBuscaLocal !== 'object') {
    log('❌ Mapa de busca não está disponível ou é inválido', 'error');
    showError('Sistema não inicializado corretamente');
    return;
  }

  // Gera todas as variações possíveis
  const variacoes = gerarVariacoes(codigoOriginal);
  log(`Variações geradas: ${variacoes.join(', ')}`, 'info');

  let produtoEncontrado = null;
  let variacaoEncontrada = null;

  // Tenta cada variação
  for (const variacao of variacoes) {
    if (mapaBuscaLocal[variacao]) {
      produtoEncontrado = mapaBuscaLocal[variacao];
      variacaoEncontrada = variacao;
      break;
    }
  }

  if (produtoEncontrado) {
    log(`✓ ENCONTRADO com variação: "${variacaoEncontrada}"`, 'success');
    log(`Descrição: ${produtoEncontrado.descricao}`, 'success');
    log(`Embalagem: ${produtoEncontrado.embalagem}`, 'success');
    mostrarProduto(produtoEncontrado);
  } else {
    log(`❌ NÃO ENCONTRADO em nenhuma variação`, 'error');
    
    // Debug: mostra códigos similares
    const similares = Object.keys(mapaBuscaLocal)
      .filter(k => k.includes(codigoOriginal.substring(0, Math.min(5, codigoOriginal.length))))
      .slice(0, 5);
    
    if (similares.length > 0) {
      log(`Códigos similares na base: ${similares.join(', ')}`, 'info');
    }
    
    showError(`Produto não encontrado (código: ${codigoOriginal})`);
  }
}

function mostrarProduto(produto) {
  document.getElementById('errorMessage').classList.remove('show');
  document.getElementById('successMessage').textContent = '✓ Produto encontrado!';
  document.getElementById('successMessage').classList.add('show');

  document.getElementById('description').value = produto.descricao || '';
  document.getElementById('packaging').value = produto.embalagem || '';
  
  // Remove mensagem de sucesso após 3 segundos
  setTimeout(() => {
    document.getElementById('successMessage').classList.remove('show');
  }, 3000);
}

function showError(message) {
  clearProduct();
  const errorDiv = document.getElementById('errorMessage');
  errorDiv.textContent = `✗ ${message}`;
  errorDiv.classList.add('show');
  
  document.getElementById('successMessage').classList.remove('show');
}

function clearProduct() {
  document.getElementById('errorMessage').classList.remove('show');
  document.getElementById('successMessage').classList.remove('show');
  document.getElementById('description').value = '';
  document.getElementById('packaging').value = '';
}

// Inicializar
document.getElementById('usuarioAvaria').textContent = sessionStorage.getItem('usuario') || '-';
log('Sistema iniciado', 'success');
carregarDados();
  </script>
</body>
</html>
