<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Gestão Perlog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/tema.css" rel="stylesheet">
    <style>

        body { display: flex; align-items: center; justify-content: center; }

        .menu-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: clamp(22px, 5vw, 40px);
            width: 100%;
            max-width: 920px;
        }

        .user-info { text-align: center; margin-bottom: 28px; }
        .user-info i {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--primary-soft);
            color: var(--primary-text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 12px;
        }
        .user-info h2 { font-size: 22px; font-weight: 700; }
        .user-info p { color: var(--muted); }

        .areas-section h3 { font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 14px; display: flex; gap: 8px; align-items: center; }

        .areas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .area-card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 16px;
            cursor: pointer;
            background: var(--surface);
            transition: .15s;
            display: grid;
            grid-template-columns: auto 1fr;
            column-gap: 14px;
            align-items: center;
            text-align: left;
        }

        .area-card:hover { border-color: var(--border-forte); background: var(--surface-2); }
        .area-card.selected { background: var(--primary-soft); border-color: var(--primary); }

        .area-card i {
            grid-row: span 2;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--primary-text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .area-card.selected i { background: var(--primary); border-color: var(--primary); color: #fff; }
        .area-card h4 { font-size: 15px; font-weight: 600; }
        .area-card p { font-size: 12px; color: var(--muted); }

        .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .actions .btn { min-width: 160px; padding: 12px 20px; }

        .status { display: block; margin-top: 16px; text-align: center; }
        .status:empty { display: none; }
        .status.warning { background: var(--amber-soft); color: var(--amber); }

        @media (max-width: 600px) {
            .areas-grid { grid-template-columns: 1fr; }
            .actions .btn { flex: 1; min-width: 0; }
        }

        .loading { display: inline-block; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="menu-container">
        <div class="user-info">
            <i class="fas fa-user-circle"></i>
            <h2>Bem-vindo!</h2>
            <p id="userName">Carregando...</p>
        </div>
        
        <div class="areas-section">
            <h3><i class="fas fa-th-large"></i> Selecione uma Área</h3>
            <div class="areas-grid" id="areasGrid">
                <!-- As áreas serão carregadas dinamicamente -->
            </div>
        </div>
        
        <div class="actions">
            <button class="btn btn-primary" id="abrirBtn" disabled onclick="abrirPainel()">
                <i class="fas fa-arrow-right"></i> Continuar
            </button>
            <button class="btn btn-secondary" onclick="sair()">
                <i class="fas fa-sign-out-alt"></i> Sair
            </button>
        </div>
        
        <div id="menuStatus"></div>
    </div>

    <script>
        let usuarioLogado = '';
        let areasSelecionadas = [];
        let areaSelecionada = '';

        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('menuStatus');
            statusEl.innerHTML = message;
            statusEl.className = `status ${type}`;
        }

        function carregarDadosUsuario() {
            usuarioLogado = sessionStorage.getItem('usuario');
            const abasString = sessionStorage.getItem('abas');
            
            console.log('Dados carregados:', { usuarioLogado, abasString });
            
            if (!usuarioLogado || !abasString) {
                showStatus('<i class="fas fa-exclamation-triangle"></i> Sessão expirada. Redirecionando para login...', 'error');
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
                return false;
            }
            
            try {
                areasSelecionadas = JSON.parse(abasString);
                document.getElementById('userName').textContent = usuarioLogado;
                console.log('Áreas disponíveis:', areasSelecionadas);
                return true;
            } catch (error) {
                console.error('Erro ao carregar dados do usuário:', error);
                showStatus('<i class="fas fa-exclamation-triangle"></i> Erro nos dados da sessão', 'error');
                return false;
            }
        }

        function criarCardsAreas() {
            const grid = document.getElementById('areasGrid');
            grid.innerHTML = '';
            
            if (!areasSelecionadas || areasSelecionadas.length === 0) {
                grid.innerHTML = '<p style="color: #666; font-style: italic;">Nenhuma área disponível para este usuário</p>';
                return;
            }

            const icones = {
                'PCP': 'fas fa-chart-line',
                'WMS': 'fas fa-warehouse',
                'Avaria': 'fas fa-warehouse',
                'Separação': 'fas fa-boxes',
                'Gestão': 'fas fa-users-cog',
                'QLP': 'fas fa-chart-bar',
                'Mapa de Carga': 'fas fa-truck-loading',
                'Alocação BOX': 'fas fa-warehouse',
                'Coletores': 'fas fa-mobile-alt',
                'Resumo equipamentos': 'fas fa-mobile-alt',
                'Resumo de Colaboradores': 'fas fa-chart-pie',
                'Resumo Base': 'fas fa-chart-pie',
                'Painel de Presença': 'fas fa-clipboard-list',
                'Produção': 'fas fa-calculator',
                'Controle de Equipamentos': 'fas fa-barcode',
                'Recebimento': 'fas fa-truck',
                'Usuários': 'fas fa-user-shield',
                'default': 'fas fa-building'
            };
            
            areasSelecionadas.forEach(area => {
                const card = document.createElement('div');
                card.className = 'area-card';
                card.onclick = () => selecionarArea(area, card);
                
                let icone = icones.default;
                for (const key in icones) {
                    if (area.toLowerCase().includes(key.toLowerCase())) {
                        icone = icones[key];
                        break;
                    }
                }
                
                card.innerHTML = `
                    <i class="${icone}"></i>
                    <h4>${area}</h4>
                    <p>Clique para selecionar esta área</p>
                `;
                
                grid.appendChild(card);
            });
        }

        function selecionarArea(area, cardElement) {
            document.querySelectorAll('.area-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            cardElement.classList.add('selected');
            areaSelecionada = area;
            
            sessionStorage.setItem('abaSelecionada', area);
            
            const abrirBtn = document.getElementById('abrirBtn');
            abrirBtn.disabled = false;
            
            console.log('Área selecionada:', area);
            
            showStatus(`<i class="fas fa-check"></i> Área "${area}" selecionada`, 'success');
            setTimeout(() => {
                document.getElementById('menuStatus').innerHTML = '';
            }, 2000);
        }

        // Área (coluna "Aba" da aba Usuarios) → tela. A ordem importa: o primeiro termo que bater vale.
        const DESTINOS = [
            { termos: ['usuarios'],                                             url: '/usuarios' },
            { termos: ['agenda do portal'],                                     url: '/recebimento#agenda' },
            { termos: ['recebimento'],                                          url: '/recebimento' },
            { termos: ['resumo de colaboradores', 'resumo colaboradores', 'resumo base', 'resumo presenca', 'resumo de presenca'], url: '/resumo-base' },
            { termos: ['resumo equipamentos', 'resumo de equipamentos', 'painel equipamentos'], url: '/resumo-equipamentos' },
            { termos: ['controle de equipamentos', 'coletor', 'rfid'],          url: '/controle-coletores' },
            { termos: ['producao', 'produtividade', 'calculadora'],             url: '/producao' },
            { termos: ['qlp'],                                                  url: '/qlp' },
            { termos: ['mapa de carga'],                                        url: '/mapacarga' },
            { termos: ['alocacao box'],                                         url: '/alocacaobox' },
            { termos: ['avaria'],                                               url: '/avaria' },
            { termos: ['painel de presenca', 'presenca'],                       url: '/painel' },
            { termos: ['gestao'],                                               url: '/ferramentas' },
        ];

        function destinoDaArea(area) {
            const a = String(area || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
            const destino = DESTINOS.find(d => d.termos.some(t => a.includes(t)));
            // Demais áreas (ex.: "WMS TA") abrem o painel de presença daquela área
            return destino ? destino.url : '/painel';
        }

        function abrirPainel() {
            if (!areaSelecionada) {
                showStatus('<i class="fas fa-exclamation-triangle"></i> Selecione uma área primeiro', 'warning');
                return;
            }
            
            const abrirBtn = document.getElementById('abrirBtn');
            abrirBtn.disabled = true;
            abrirBtn.innerHTML = '<i class="fas fa-spinner loading"></i> Abrindo...';
            
            console.log('Redirecionando para área:', areaSelecionada);
            
            // Salva dados na sessão
            sessionStorage.setItem('usuario', usuarioLogado);
            sessionStorage.setItem('abaSelecionada', areaSelecionada);
            
            setTimeout(() => {
                window.location.href = destinoDaArea(areaSelecionada);
            }, 500);
        }

        function sair() {
            if (confirm('Tem certeza que deseja sair do sistema?')) {
                sessionStorage.clear();
                window.location.href = '/';
            }
        }

        // Busca na planilha as áreas atuais do usuário (permissões alteradas depois do login)
        async function atualizarAreas() {
            const token = sessionStorage.getItem('token');
            if (!token) return;
            try {
                const resp = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'minhasAreas', token })
                });
                const r = await resp.json();
                if (!r.ok || !Array.isArray(r.abas) || !r.abas.length) return;
                if (JSON.stringify(r.abas) === JSON.stringify(areasSelecionadas)) return;
                areasSelecionadas = r.abas;
                sessionStorage.setItem('abas', JSON.stringify(r.abas));
                criarCardsAreas();
            } catch (e) {
                console.warn('Não foi possível atualizar as áreas:', e.message);
            }
        }

        window.onload = function() {
            console.log('Menu carregando...');
            
            if (carregarDadosUsuario()) {
                criarCardsAreas();
                atualizarAreas();
                showStatus('<i class="fas fa-check"></i> Menu carregado com sucesso', 'success');
                setTimeout(() => {
                    document.getElementById('menuStatus').innerHTML = '';
                }, 2000);
            }
        };

        console.log('Menu.html carregado');
        console.log('SessionStorage atual:', {
            usuario: sessionStorage.getItem('usuario'),
            abas: sessionStorage.getItem('abas'),
            abaSelecionada: sessionStorage.getItem('abaSelecionada')
        });
    </script>
</body>
</html>
